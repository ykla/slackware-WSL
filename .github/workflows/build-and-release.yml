name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - version: '15.0'
            arch: '64'
            runner: ubuntu-latest
          - version: 'current'
            arch: '64'
            runner: ubuntu-latest
          - version: 'current'
            arch: 'aarch64'
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: 构建镜像 (${{ matrix.arch }} ${{ matrix.version }})
        run: sudo VERSION=${{ matrix.version }} ARCH=${{ matrix.arch }} bash build.sh

      - name: 上传产物 (${{ matrix.arch }}-${{ matrix.version }})
        uses: actions/upload-artifact@v6
        with:
          name: slackware-${{ matrix.arch }}-${{ matrix.version }}
          path: '*.tar.gz'
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: slackware-64-15.0
          path: artifacts

      - uses: actions/download-artifact@v5
        with:
          name: slackware-64-current
          path: artifacts

      - uses: actions/download-artifact@v5
        with:
          name: slackware-aarch64-current
          path: artifacts

      - name: 确定 tag 名
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=auto-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: 'artifacts/*.tar.gz'
          tag_name: ${{ steps.tag.outputs.name }}
          name: Slackware WSL (Build #${{ github.run_number }})
          generate_release_notes: true
          body: |
            Slackware 15.0 (x86_64 ) / current (x86_64 & aarch64) 基本系统，FreeBSD 兼容层用。
