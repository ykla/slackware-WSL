name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['15.0', 'current']
    steps:
      - uses: actions/checkout@v6

      - name: 构建镜像 (${{ matrix.version }})
        run: sudo VERSION=${{ matrix.version }} bash build.sh

      - name: 上传产物 (${{ matrix.version }})
        uses: actions/upload-artifact@v4
        with:
          name: slackware-${{ matrix.version }}
          path: '*.tar.gz'
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slackware-15.0
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: slackware-current
          path: artifacts

      - name: 确定 tag 名
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=auto-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: 'artifacts/*.tar.gz'
          tag_name: ${{ steps.tag.outputs.name }}
          name: Slackware WSL (Build #${{ github.run_number }})
          generate_release_notes: true
          body: |
            Slackware 15.0 / current WSL 最小化文件系统镜像。

            ### 使用方法
            以 15.0 为例：
            ```shell
            lxrunoffline i -n Slackware -d D:\\WSL\\Slackware -f slackware64-15.0.tar.gz
            ```